<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ci-practice v{{VERSION}}</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --badge-bg: #dafbe1;
      --badge-text: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --text: #e6edf3;
        --muted: #9198a1;
        --border: #3d444d;
        --badge-bg: #0f2d1a;
        --badge-text: #3fb950;
      }
    }
    body {
      margin: 0;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { margin-bottom: 4px; }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-weight: 600;
      font-size: 14px;
    }
    p { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    footer { margin-top: 32px; font-size: 14px; color: var(--muted); }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>ci-practice</h1>
    <span class="badge">version {{VERSION}}</span>

    <p>A small Python project for learning CI/CD with GitHub Actions.
       This page is published automatically every time a new version is released.</p>

    <h2>Demo</h2>
    <table>
      <thead>
        <tr><th>Code</th><th>Result</th></tr>
      </thead>
      <tbody>
{{DEMO_ROWS}}
      </tbody>
    </table>

    <footer>
      <a href="https://github.com/jayawardhnaRMA/ci-practice">Source code</a> ·
      <a href="https://github.com/jayawardhnaRMA/ci-practice/releases">Releases</a>
    </footer>
  </main>
</body>
</html>
